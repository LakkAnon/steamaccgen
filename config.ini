[steam]

# ── Email / IMAP ──────────────────────────────────────────
# The address that receives Steam verification + Steam Guard emails
email = placeholder@gmail.com
# Gmail App Password (16 characters, no spaces)
app_password = APP PASSWORD FROM GMAIL
# IMAP server (default: Gmail)
imap_host = imap.gmail.com
imap_port = 993

# ── Timing ────────────────────────────────────────────────
# Seconds to wait for a captcha solve
captcha_timeout = 300
# Seconds between inbox polls
check_interval = 5
# How far back to search for emails
lookback_hours = 1
# Typing speed range (seconds per keystroke, lower = faster)
typing_speed_min = 0.008
typing_speed_max = 0.050

# ── Behaviour ─────────────────────────────────────────────
# Run the Steam Guard disable step after account creation
disable_steam_guard = true
# Run Chrome in headless mode (captcha will not work headless)
headless = false

# ── Output ────────────────────────────────────────────────
# Where to save accounts (format: username:password, one per line)
output_file = accounts.txt

randomize_profile = true